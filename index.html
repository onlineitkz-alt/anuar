<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Калькулятор PWA</title>
    
    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Калькулятор">
    <meta name="theme-color" content="#0B0F19">
    <meta name="application-name" content="Калькулятор">
    
    <!-- Inline Dynamic App Icon (SVG Data URI) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230B0F19'/><rect x='15' y='15' width='70' height='20' rx='6' fill='%231E293B'/><circle cx='25' cy='50' r='7' fill='%2338BDF8'/><circle cx='50' cy='50' r='7' fill='%2338BDF8'/><circle cx='75' cy='50' r='7' fill='%23F97316'/><circle cx='25' cy='75' r='7' fill='%2338BDF8'/><circle cx='50' cy='75' r='7' fill='%2338BDF8'/><circle cx='75' cy='75' r='7' fill='%23F97316'/></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230B0F19'/><rect x='15' y='15' width='70' height='20' rx='6' fill='%231E293B'/><circle cx='25' cy='50' r='7' fill='%2338BDF8'/><circle cx='50' cy='50' r='7' fill='%2338BDF8'/><circle cx='75' cy='50' r='7' fill='%23F97316'/><circle cx='25' cy='75' r='7' fill='%2338BDF8'/><circle cx='50' cy='75' r='7' fill='%2338BDF8'/><circle cx='75' cy='75' r='7' fill='%23F97316'/></svg>">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Touch and Viewport adjustments for PWA */
        :root {
            --sat: env(safe-area-inset-top);
            --sab: env(safe-area-inset-bottom);
        }
        
        body {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
        }

        /* Glassmorphism utility */
        .glass {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Active button pressed states */
        .btn-tap {
            transition: transform 0.08s cubic-bezier(0.2, 0.8, 0.2, 1), background-color 0.15s ease, filter 0.15s ease;
        }
        
        .btn-tap:active {
            transform: scale(0.92);
            filter: brightness(1.3);
        }

        /* Custom scrollbar for display/history */
        ::-webkit-scrollbar {
            height: 4px;
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        /* Drawer Slide Animation */
        .drawer-slide {
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
</head>
<body class="min-h-screen w-full flex flex-col justify-between overflow-hidden antialiased select-none" style="padding-top: var(--sat); padding-bottom: var(--sab);">

    <!-- Top Navigation / Header -->
    <header class="w-full px-5 py-3 flex justify-between items-center z-10">
        <button id="historyBtn" class="p-2.5 rounded-2xl glass text-slate-300 hover:text-white btn-tap flex items-center justify-center gap-1.5 text-xs font-medium">
            <i data-lucide="history" class="w-4 h-4"></i>
            <span>История</span>
        </button>
        
        <div class="flex items-center gap-2">
            <span class="text-xs font-semibold uppercase tracking-wider text-slate-400 bg-slate-800/80 px-2.5 py-1 rounded-full border border-slate-700/50">PWA App</span>
            <button id="infoBtn" class="p-2.5 rounded-2xl glass text-slate-300 hover:text-white btn-tap">
                <i data-lucide="info" class="w-4 h-4"></i>
            </button>
        </div>
    </header>

    <!-- Calculator Screen / Display Section -->
    <main class="flex-1 flex flex-col justify-end px-6 pb-4 pt-2 overflow-hidden">
        <!-- Previous Formula / Expression -->
        <div id="expressionDisplay" class="text-right text-slate-400 text-lg md:text-xl font-normal h-8 overflow-x-auto whitespace-nowrap scroll-smooth tracking-wide">
            <!-- Dynamic content -->
        </div>

        <!-- Current Output Result -->
        <div class="relative w-full overflow-hidden mt-1">
            <div id="resultDisplay" class="text-right text-white text-5xl sm:text-6xl md:text-7xl font-light tracking-tight overflow-x-auto whitespace-nowrap scroll-smooth py-1 transition-all">
                0
            </div>
        </div>
    </main>

    <!-- Keypad Container -->
    <section class="w-full max-w-md mx-auto px-4 pb-6 pt-2 grid grid-cols-4 gap-3 sm:gap-4">
        <!-- Row 1 -->
        <button data-action="clear" class="btn-tap h-16 sm:h-18 rounded-2xl bg-slate-800/80 text-rose-400 text-xl font-semibold glass border-rose-500/20 flex items-center justify-center">
            AC
        </button>
        <button data-action="toggle-sign" class="btn-tap h-16 sm:h-18 rounded-2xl bg-slate-800/80 text-sky-400 text-xl font-medium glass flex items-center justify-center">
            ⁺/₋
        </button>
        <button data-action="percent" class="btn-tap h-16 sm:h-18 rounded-2xl bg-slate-800/80 text-sky-400 text-xl font-medium glass flex items-center justify-center">
            %
        </button>
        <button data-action="operator" data-val="/" class="btn-tap h-16 sm:h-18 rounded-2xl bg-amber-500/90 hover:bg-amber-500 text-white text-2xl font-semibold shadow-lg shadow-amber-500/20 flex items-center justify-center">
            ÷
        </button>

        <!-- Row 2 -->
        <button data-action="num" data-val="7" class="btn-tap h-16 sm:h-18 rounded-2xl bg-slate-800/40 text-slate-100 text-2xl font-normal glass flex items-center justify-center">
            7
        </button>
        <button data-action="num" data-val="8" class="btn-tap h-16 sm:h-18 rounded-2xl bg-slate-800/40 text-slate-100 text-2xl font-normal glass flex items-center justify-center">
            8
        </button>
        <button data-action="num" data-val="9" class="btn-tap h-16 sm:h-18 rounded-2xl bg-slate-800/40 text-slate-100 text-2xl font-normal glass flex items-center justify-center">
            9
        </button>
        <button data-action="operator" data-val="*" class="btn-tap h-16 sm:h-18 rounded-2xl bg-amber-500/90 hover:bg-amber-500 text-white text-2xl font-semibold shadow-lg shadow-amber-500/20 flex items-center justify-center">
            ×
        </button>

        <!-- Row 3 -->
        <button data-action="num" data-val="4" class="btn-tap h-16 sm:h-18 rounded-2xl bg-slate-800/40 text-slate-100 text-2xl font-normal glass flex items-center justify-center">
            4
        </button>
        <button data-action="num" data-val="5" class="btn-tap h-16 sm:h-18 rounded-2xl bg-slate-800/40 text-slate-100 text-2xl font-normal glass flex items-center justify-center">
            5
        </button>
        <button data-action="num" data-val="6" class="btn-tap h-16 sm:h-18 rounded-2xl bg-slate-800/40 text-slate-100 text-2xl font-normal glass flex items-center justify-center">
            6
        </button>
        <button data-action="operator" data-val="-" class="btn-tap h-16 sm:h-18 rounded-2xl bg-amber-500/90 hover:bg-amber-500 text-white text-2xl font-semibold shadow-lg shadow-amber-500/20 flex items-center justify-center">
            −
        </button>

        <!-- Row 4 -->
        <button data-action="num" data-val="1" class="btn-tap h-16 sm:h-18 rounded-2xl bg-slate-800/40 text-slate-100 text-2xl font-normal glass flex items-center justify-center">
            1
        </button>
        <button data-action="num" data-val="2" class="btn-tap h-16 sm:h-18 rounded-2xl bg-slate-800/40 text-slate-100 text-2xl font-normal glass flex items-center justify-center">
            2
        </button>
        <button data-action="num" data-val="3" class="btn-tap h-16 sm:h-18 rounded-2xl bg-slate-800/40 text-slate-100 text-2xl font-normal glass flex items-center justify-center">
            3
        </button>
        <button data-action="operator" data-val="+" class="btn-tap h-16 sm:h-18 rounded-2xl bg-amber-500/90 hover:bg-amber-500 text-white text-2xl font-semibold shadow-lg shadow-amber-500/20 flex items-center justify-center">
            +
        </button>

        <!-- Row 5 -->
        <button data-action="backspace" class="btn-tap h-16 sm:h-18 rounded-2xl bg-slate-800/40 text-slate-300 glass flex items-center justify-center">
            <i data-lucide="delete" class="w-6 h-6"></i>
        </button>
        <button data-action="num" data-val="0" class="btn-tap h-16 sm:h-18 rounded-2xl bg-slate-800/40 text-slate-100 text-2xl font-normal glass flex items-center justify-center">
            0
        </button>
        <button data-action="decimal" class="btn-tap h-16 sm:h-18 rounded-2xl bg-slate-800/40 text-slate-100 text-2xl font-normal glass flex items-center justify-center">
            ,
        </button>
        <button data-action="equals" class="btn-tap h-16 sm:h-18 rounded-2xl bg-gradient-to-r from-sky-500 to-blue-600 text-white text-3xl font-semibold shadow-lg shadow-sky-500/30 flex items-center justify-center">
            =
        </button>
    </section>

    <!-- History Slide-Up Sheet -->
    <div id="historyModal" class="fixed inset-0 bg-black/60 backdrop-blur-md z-30 opacity-0 pointer-events-none transition-opacity duration-300 flex flex-col justify-end">
        <div id="historySheet" class="w-full max-w-md mx-auto bg-slate-900 border-t border-slate-800 rounded-t-3xl max-h-[75vh] flex flex-col transform translate-y-full drawer-slide shadow-2xl">
            <!-- Header -->
            <div class="p-5 border-b border-slate-800 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <i data-lucide="history" class="w-5 h-5 text-sky-400"></i>
                    <h3 class="text-lg font-semibold text-white">История вычислений</h3>
                </div>
                <div class="flex items-center gap-2">
                    <button id="clearHistoryBtn" class="text-xs text-rose-400 hover:text-rose-300 px-3 py-1.5 rounded-lg bg-rose-500/10 border border-rose-500/20">
                        Очистить
                    </button>
                    <button id="closeHistoryBtn" class="p-1.5 text-slate-400 hover:text-white rounded-full">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
            
            <!-- History List -->
            <div id="historyList" class="p-4 overflow-y-auto flex-1 space-y-3">
                <!-- Dynamically populated -->
            </div>
        </div>
    </div>

    <!-- Info / PWA Setup Modal -->
    <div id="infoModal" class="fixed inset-0 bg-black/60 backdrop-blur-md z-30 opacity-0 pointer-events-none transition-opacity duration-300 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-sm p-6 space-y-4 text-slate-300">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-lg font-semibold text-white flex items-center gap-2">
                    <i data-lucide="smartphone" class="w-5 h-5 text-sky-400"></i>
                    Установка приложения
                </h3>
                <button id="closeInfoBtn" class="p-1 text-slate-400 hover:text-white">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <div class="space-y-3 text-sm leading-relaxed">
                <p><strong class="text-white">iOS (Safari):</strong> Нажмите кнопку «Поделиться» <i data-lucide="share" class="inline w-4 h-4 text-sky-400"></i> и выберите <span class="text-white font-medium">«На экран "Домой"»</span>.</p>
                <p><strong class="text-white">Android (Chrome):</strong> Нажмите три точки <i data-lucide="more-vertical" class="inline w-4 h-4 text-sky-400"></i> и выберите <span class="text-white font-medium">«Добавить на главный экран»</span>.</p>
                <p class="text-xs text-slate-500 pt-2 border-t border-slate-800">
                    Приложение работает полностью офлайн и сохраняет историю в памяти вашего устройства.
                </p>
            </div>
        </div>
    </div>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // App State
        let currentInput = '0';
        let previousInput = '';
        let operator = null;
        let shouldResetDisplay = false;
        let history = JSON.parse(localStorage.getItem('calc_pwa_history') || '[]');

        // DOM Elements
        const resultDisplay = document.getElementById('resultDisplay');
        const expressionDisplay = document.getElementById('expressionDisplay');
        const historyModal = document.getElementById('historyModal');
        const historySheet = document.getElementById('historySheet');
        const historyList = document.getElementById('historyList');
        const historyBtn = document.getElementById('historyBtn');
        const closeHistoryBtn = document.getElementById('closeHistoryBtn');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');
        const infoModal = document.getElementById('infoModal');
        const infoBtn = document.getElementById('infoBtn');
        const closeInfoBtn = document.getElementById('closeInfoBtn');

        // Haptic Feedback Helper
        function triggerHaptic() {
            if (navigator.vibrate) {
                try { navigator.vibrate(12); } catch (e) {}
            }
        }

        // Format Numbers for Display (e.g. 1 234,56)
        function formatNumber(numStr) {
            if (numStr === 'Error' || numStr === 'Infinity' || numStr === '-Infinity') return 'Ошибка';
            if (!numStr) return '0';
            
            const parts = numStr.toString().split('.');
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
            return parts.join(',');
        }

        // Update Screen UI
        function updateDisplay() {
            resultDisplay.textContent = formatNumber(currentInput);
            
            let exp = '';
            if (previousInput && operator) {
                const opSymbol = { '/': '÷', '*': '×', '-': '−', '+': '+' }[operator] || operator;
                exp = `${formatNumber(previousInput)} ${opSymbol}`;
            }
            expressionDisplay.textContent = exp;

            // Auto-scroll to end on long numbers
            resultDisplay.scrollLeft = resultDisplay.scrollWidth;
            expressionDisplay.scrollLeft = expressionDisplay.scrollWidth;
        }

        // Handle Digit Click
        function handleNumber(digit) {
            triggerHaptic();
            if (currentInput === '0' || shouldResetDisplay) {
                currentInput = digit;
                shouldResetDisplay = false;
            } else {
                if (currentInput.replace(/[^0-9]/g, '').length >= 12) return; // limit length
                currentInput += digit;
            }
            updateDisplay();
        }

        // Handle Decimal Point
        function handleDecimal() {
            triggerHaptic();
            if (shouldResetDisplay) {
                currentInput = '0.';
                shouldResetDisplay = false;
            } else if (!currentInput.includes('.')) {
                currentInput += '.';
            }
            updateDisplay();
        }

        // Handle Operators
        function handleOperator(op) {
            triggerHaptic();
            if (operator && !shouldResetDisplay) {
                calculateResult();
            }
            previousInput = currentInput;
            operator = op;
            shouldResetDisplay = true;
            updateDisplay();
        }

        // Core Math Evaluation
        function calculateResult() {
            if (!operator || !previousInput) return;

            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);
            let res = 0;

            switch (operator) {
                case '+': res = prev + current; break;
                case '-': res = prev - current; break;
                case '*': res = prev * current; break;
                case '/': 
                    if (current === 0) {
                        currentInput = 'Error';
                        operator = null;
                        previousInput = '';
                        updateDisplay();
                        return;
                    }
                    res = prev / current; 
                    break;
            }

            // Fix JS Floating point precision (e.g. 0.1 + 0.2 = 0.30000000000000004)
            res = Math.round(res * 1e10) / 1e10;

            const opSymbol = { '/': '÷', '*': '×', '-': '−', '+': '+' }[operator];
            const expressionStr = `${formatNumber(previousInput)} ${opSymbol} ${formatNumber(currentInput)}`;
            
            // Save to history
            saveHistory(expressionStr, res.toString());

            currentInput = res.toString();
            operator = null;
            previousInput = '';
            shouldResetDisplay = true;
            updateDisplay();
        }

        // Percentage Function
        function handlePercent() {
            triggerHaptic();
            let val = parseFloat(currentInput);
            if (isNaN(val)) return;
            val = val / 100;
            currentInput = val.toString();
            updateDisplay();
        }

        // Toggle Sign (+/-)
        function handleToggleSign() {
            triggerHaptic();
            if (currentInput === '0' || currentInput === 'Error') return;
            currentInput = (parseFloat(currentInput) * -1).toString();
            updateDisplay();
        }

        // Clear All
        function handleClear() {
            triggerHaptic();
            currentInput = '0';
            previousInput = '';
            operator = null;
            shouldResetDisplay = false;
            updateDisplay();
        }

        // Backspace
        function handleBackspace() {
            triggerHaptic();
            if (shouldResetDisplay) return;
            if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
            } else {
                currentInput = '0';
            }
            updateDisplay();
        }

        // History Logic
        function saveHistory(expr, result) {
            history.unshift({ expr, result, id: Date.now() });
            if (history.length > 30) history.pop();
            localStorage.setItem('calc_pwa_history', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            if (history.length === 0) {
                historyList.innerHTML = `
                    <div class="text-center py-8 text-slate-500 text-sm">
                        История вычислений пуста
                    </div>`;
                return;
            }

            historyList.innerHTML = history.map(item => `
                <div data-res="${item.result}" class="history-item p-3.5 rounded-2xl bg-slate-800/50 hover:bg-slate-800/80 border border-slate-700/40 cursor-pointer btn-tap">
                    <div class="text-xs text-slate-400 text-right mb-0.5">${item.expr}</div>
                    <div class="text-lg font-medium text-sky-400 text-right">= ${formatNumber(item.result)}</div>
                </div>
            `).join('');

            // Click item to insert result
            document.querySelectorAll('.history-item').forEach(el => {
                el.addEventListener('click', () => {
                    triggerHaptic();
                    currentInput = el.getAttribute('data-res');
                    shouldResetDisplay = false;
                    updateDisplay();
                    toggleHistory(false);
                });
            });
        }

        function toggleHistory(show) {
            if (show) {
                renderHistory();
                historyModal.classList.remove('opacity-0', 'pointer-events-none');
                historySheet.classList.remove('translate-y-full');
            } else {
                historyModal.classList.add('opacity-0', 'pointer-events-none');
                historySheet.classList.add('translate-y-full');
            }
        }

        function toggleInfo(show) {
            if (show) {
                infoModal.classList.remove('opacity-0', 'pointer-events-none');
            } else {
                infoModal.classList.add('opacity-0', 'pointer-events-none');
            }
        }

        // Event Listeners for Buttons
        document.querySelectorAll('button[data-action]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const action = btn.dataset.action;
                const val = btn.dataset.val;

                switch (action) {
                    case 'num': handleNumber(val); break;
                    case 'decimal': handleDecimal(); break;
                    case 'operator': handleOperator(val); break;
                    case 'equals': calculateResult(); triggerHaptic(); break;
                    case 'clear': handleClear(); break;
                    case 'percent': handlePercent(); break;
                    case 'toggle-sign': handleToggleSign(); break;
                    case 'backspace': handleBackspace(); break;
                }
            });
        });

        // Modal triggers
        historyBtn.addEventListener('click', () => toggleHistory(true));
        closeHistoryBtn.addEventListener('click', () => toggleHistory(false));
        historyModal.addEventListener('click', (e) => {
            if (e.target === historyModal) toggleHistory(false);
        });

        clearHistoryBtn.addEventListener('click', () => {
            triggerHaptic();
            history = [];
            localStorage.removeItem('calc_pwa_history');
            renderHistory();
        });

        infoBtn.addEventListener('click', () => toggleInfo(true));
        closeInfoBtn.addEventListener('click', () => toggleInfo(false));
        infoModal.addEventListener('click', (e) => {
            if (e.target === infoModal) toggleInfo(false);
        });

        // Desktop Keyboard Support
        window.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') handleNumber(e.key);
            if (e.key === '.' || e.key === ',') handleDecimal();
            if (['+', '-', '*', '/'].includes(e.key)) handleOperator(e.key);
            if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); calculateResult(); }
            if (e.key === 'Backspace') handleBackspace();
            if (e.key === 'Escape') handleClear();
            if (e.key === '%') handlePercent();
        });

        // Prevent iOS double tap zoom
        document.addEventListener('touchend', (e) => {
            const now = (new Date()).getTime();
            if (now - (window.lastTouchEnd || 0) <= 300) {
                e.preventDefault();
            }
            window.lastTouchEnd = now;
        }, false);
    </script>
</body>
</html>
